[project]
name = "qleric"
version = "0.3.0"
description = "Grounded document extraction. Every value ships with verbatim + page + bbox."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymupdf==1.27.2.2",
    "rapidfuzz==3.14.6",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "flask==3.0.0",
]

[project.scripts]
qleric = "qleric.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qleric*"]
